name: Mock Enterprise CI/CD (Always Runs)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  lint:
    name: Lint (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          echo "Running linter..."
          sleep 2
          echo "shellcheck..."
          sleep 1
          echo "eslint..."
          sleep 1
          echo "lint ✅"

  unit_common:
    name: Unit - common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Running common unit tests..."
          sleep 2
          echo "common tests passed ✅"

  unit_auth:
    name: Unit - auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Running auth unit tests..."
          sleep 2
          echo "auth tests passed ✅"

  unit_payments:
    name: Unit - payments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Running payments unit tests..."
          sleep 2
          echo "payments tests passed ✅"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit_common, unit_auth, unit_payments]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Running integration tests..."
          sleep 3
          echo "integration passed ✅"

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Building Docker images..."
          sleep 3
          echo "Tagging images..."
          sleep 1
          echo "build complete ✅"

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Deploying to staging..."
          sleep 3
          echo "Health check..."
          sleep 1
          echo "staging deployed ✅"

  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Deploying to production..."
          sleep 3
          echo "Health check..."
          sleep 1
          echo "production deployed ✅"
