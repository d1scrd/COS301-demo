name: CI-CD (Mock Enterprise)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Linting..."
          test -f services/payments/app.sh
          test -f services/auth/app.sh
          test -f libs/common/util.sh
          echo "lint ✅"

  unit_common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash libs/common/test.sh

  unit_auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash services/auth/test.sh

  unit_payments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash services/payments/test.sh

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit_common, unit_auth, unit_payments]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "integration..."
          bash services/auth/app.sh
          bash services/payments/app.sh
          echo "integration ✅"

  build_artifacts:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist
          tar -czf dist/auth.tar.gz services/auth libs/common
          tar -czf dist/payments.tar.gz services/payments libs/common
          ls -lah dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*.tar.gz

  deploy_staging:
    runs-on: ubuntu-latest
    needs: [build_artifacts]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/deploy.sh staging all

  deploy_production:
    runs-on: ubuntu-latest
    needs: [build_artifacts]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/deploy.sh production all
